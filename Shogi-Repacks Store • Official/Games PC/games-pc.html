* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {

	-webkit-font-smoothing: antialiased;
	overflow-x: hidden;

/* NAVBAR TOP */
.ig-navbar {

}

.ig-brand {

	align-items: center;
	gap: 10px;

}

.ig-brand-logo {

.ig-brand-logo img {

	height: 100%;

	image-rendering: -webkit-optimize-contrast;
}

.ig-brand-text {
	display: flex;
	flex-direction: column;
	justify-content: center;
}

.brand-title-main {

	font-size: 15px;
	font-weight: 700;
	letter-spacing: 1.8px;

}

.brand-title-sub {

.ig-nav-actions {

}

/* BOUTON PANIER */
.ig-icon-btn {

	border-radius: 10px;
	font-size: 13px;

.ig-icon-btn:hover { background: rgba(255, 255, 255, 0.15); }

.ig-cart-icon-img {

/* BARRE DES PLATEFORMES (STICKY) */
.platforms-bar {
	display: flex;

	padding: 12px 16px;

	position: sticky;

}
.platforms-bar::-webkit-scrollbar { display: none; }

.platform-pill {

	border-radius: 20px;

	transition: all 0.2s;
	display: flex;
	align-items: center;
	gap: 6px;
	text-decoration: none;
}
.platform-pill:hover, .platform-pill.active {

	color: #fff;
	border-color: var(--accent);
}

.container {

	padding: 16px;

/* BARRE DE RECHERCHE PRO */
.search-section {

}
.search-box-container {

	width: 100%;

	align-items: center;
}

#gameSearch {
	width: 100%;
	padding: 14px 40px 14px 45px;
	background: var(--card-bg);
	border: 1px solid var(--border-glass);
	border-radius: 14px;
	color: #ffffff; 
	font-size: 14px;
	outline: none; 
	transition: all 0.2s ease;
}
#gameSearch:focus {
	border-color: var(--accent);
	background: var(--card-hover);
}

.search-icon {
	position: absolute;
	left: 15px;
	width: 18px; height: 18px;
	fill: var(--text-muted);
}

.clear-search-btn {
	position: absolute;
	right: 14px;
	background: rgba(255, 255, 255, 0.08);
	border: none;
	color: var(--text-muted);

	border-radius: 50%;
	display: none;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	font-size: 14px;
}

.section-title {
	font-size: 15px;
	text-transform: uppercase;
	font-weight: 900;
	letter-spacing: 1px;
	margin-bottom: 14px;

	align-items: center;
	justify-content: space-between;
}

.game-grid {

	grid-template-columns: repeat(2, 1fr);

}
@media (min-width: 992px) {
	.game-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
}

	flex-direction: column;

	will-change: transform;

.game-card:hover {

}

.game-thumbnail-container {

(function initAdaptiveResolution() {
	const dpr = window.devicePixelRatio || 1;
	const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
	document.documentElement.style.setProperty('--vh-scale', `${window.innerHeight * 0.01}px`);
	if (isMobile && dpr > 1) { document.body.classList.add('high-density-mobile'); }
	window.addEventListener('resize', () => {
		document.documentElement.style.setProperty('--vh-scale', `${window.innerHeight * 0.01}px`);
	});
})();

let imageObserver = null;
function initImageObserver() {
	if ('IntersectionObserver' in window) {
		imageObserver = new IntersectionObserver((entries, observer) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					const img = entry.target;
					const realSrc = img.getAttribute('data-src');
					if (realSrc) {
						img.src = realSrc;
						img.onload = () => img.classList.add('loaded');
						img.removeAttribute('data-src');
					}
					observer.unobserve(img);
				}
			});
		}, { root: null, rootMargin: '100px 0px', threshold: 0.01 });
	}
}

document.addEventListener("DOMContentLoaded", () => {
	initImageObserver();
	if (clientName) {
		updateUserProfileDisplay(clientName);
	}
	renderPcGames();
	updateCartBadge();
});

function updateUserProfileDisplay(name) {
	const badge = document.getElementById('userProfileBadge');
	const nameSpan = document.getElementById('navClientName');
	if (badge && nameSpan) {
		nameSpan.innerText = name;
		badge.style.display = 'flex';
	}
}

function slugify(text) {
	return text.toString().toLowerCase()
		.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
		.replace(/['']/g, '-')
		.replace(/[^a-z0-9 -]/g, '')
		.replace(/\s+/g, '-')
		.replace(/-+/g, '-');
}

function renderPcGames() {
	const grid = document.getElementById('pcGameGrid');
	grid.innerHTML = '';
	
	const filteredGames = pcGamesData.filter(game => {
		const [year, name] = game;
		const fullName = `${name} ${year}`.toLowerCase();
		return fullName.includes(currentSearchQuery);
	});

	const totalItems = filteredGames.length;
	const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
	
	if (currentPage > totalPages) currentPage = totalPages;
	
	const startIndex = (currentPage - 1) * itemsPerPage;
	const endIndex = startIndex + itemsPerPage;
	const paginatedGames = filteredGames.slice(startIndex, endIndex);

	paginatedGames.forEach(game => {
		const [year, name, info] = game;
		const imageFileName = `images/${slugify(name)}.jpg`;
		const fullGameName = `${name} (${year})`;
		const orderText = `Enchanté Mr Sev, c'est ${clientName || 'un client'}. Je souhaite commander ${fullGameName} sur PC.`;
		const waLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(orderText)}`;
		
		const card = document.createElement('div');
		card.className = 'game-card';
		card.onclick = () => openGameModal(name, year, info, imageFileName, waLink);

		card.innerHTML = `
			<div>
				<div class="game-thumbnail-container">
					<img data-src="${imageFileName}" alt="${escapeHtml(name)}" class="game-thumbnail" onerror="this.style.display='none'">
				</div>
				<div class="card-top">
					<span class="game-year">${year}</span>
					<span class="game-price">${gamePriceFC.toLocaleString('fr-FR')} FC / ${gamePriceUSD} $</span>
				</div>
				<div class="game-name">${escapeHtml(name)}</div>
				<div class="game-info">${escapeHtml(info)}</div>
			</div>
			<div class="card-actions" onclick="event.stopPropagation()">
				<button class="btn-cart-mini" onclick="addToCart('${escapeQuotes(name)}', '${year}', 'PC', '${imageFileName}')">Panier</button>
				<a href="${waLink}" target="_blank" class="btn-whatsapp-mini">
					<svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
					Acheter
				</a>
			</div>
		`;
		grid.appendChild(card);

		const imgElement = card.querySelector('.game-thumbnail');
		if (imageObserver) {
			imageObserver.observe(imgElement);
		} else {
			imgElement.src = imageFileName;
			imgElement.onload = () => imgElement.classList.add('loaded');
		}
	});

	updateCounter(totalItems);
	renderPagination(totalPages);
}

function renderPagination(totalPages) {
	const container = document.getElementById('paginationContainer');
	container.innerHTML = '';

	if (totalPages <= 1) return;

	const btn1 = document.createElement('button');
	btn1.className = `page-btn ${currentPage === 1 ? 'active' : ''}`;
	btn1.innerText = '1';
	btn1.onclick = () => goToPage(1);
	container.appendChild(btn1);

	if (totalPages >= 2) {
		const btn2 = document.createElement('button');
		btn2.className = `page-btn ${currentPage === 2 ? 'active' : ''}`;
		btn2.innerText = '2';
		btn2.onclick = () => goToPage(2);
		container.appendChild(btn2);
	}

	if (totalPages > 3) {
		const dots = document.createElement('span');
		dots.style.cssText = "color:var(--text-muted); padding:0 4px; font-weight:800;";
		dots.innerText = '...';
		container.appendChild(dots);
	}

	if (totalPages >= 3 && currentPage >= 3) {
		const btn3 = document.createElement('button');
		btn3.className = `page-btn active`;
		btn3.innerText = currentPage;
		container.appendChild(btn3);
	}

	const nextBtn = document.createElement('button');
	nextBtn.className = `page-btn ${currentPage >= totalPages ? 'disabled' : ''}`;
	nextBtn.innerHTML = 'Suivant &raquo;';
	nextBtn.onclick = () => {
		if (currentPage < totalPages) goToPage(currentPage + 1);
	};
	container.appendChild(nextBtn);
}

function goToPage(page) {
	currentPage = page;
	renderPcGames();
	window.scrollTo({ top: 100, behavior: 'smooth' });
}

function handleSearchInput() {
	currentSearchQuery = document.getElementById('gameSearch').value.trim().toLowerCase();
	document.getElementById('clearSearchBtn').style.display = currentSearchQuery ? 'flex' : 'none';
	currentPage = 1;
	renderPcGames();
}

function clearSearch() {
	document.getElementById('gameSearch').value = '';
	currentSearchQuery = '';
	document.getElementById('clearSearchBtn').style.display = 'none';
	currentPage = 1;
	renderPcGames();
}

function updateCounter(total) {
	document.getElementById('gameCounter').innerText = `${total} jeux`;
	document.getElementById('noResults').style.display = total === 0 ? 'block' : 'none';
}

function openGameModal(name, year, info, imgUrl, waLink) {
	document.getElementById('modalImg').src = imgUrl;
	document.getElementById('modalTitle').innerText = name;
	document.getElementById('modalYear').innerText = `Année : ${year}`;
	document.getElementById('modalPrice').innerText = `${gamePriceFC.toLocaleString('fr-FR')} FC / ${gamePriceUSD} $`;
	document.getElementById('modalDesc').innerText = info;
	document.getElementById('modalActions').innerHTML = `
		<button class="btn-cart-mini" style="flex:1; padding: 12px;" onclick="addToCart('${escapeQuotes(name)}', '${year}', 'PC', '${imgUrl}'); closeGameModal();">Ajouter au Panier</button>
		<a href="${waLink}" target="_blank" class="btn-whatsapp-mini" style="padding: 12px;">Commander WhatsApp</a>
	`;
	document.getElementById('gameModal').style.display = 'flex';
}

function closeGameModal() {
	document.getElementById('gameModal').style.display = 'none';
}

function toggleCartDrawer() {
	const overlay = document.getElementById('cartOverlay');
	if (overlay.style.display === 'flex') {
		overlay.classList.remove('open');
		setTimeout(() => overlay.style.display = 'none', 300);
	} else {
		overlay.style.display = 'flex';
		setTimeout(() => overlay.classList.add('open'), 10);
		renderCart();
	}
}

function addToCart(name, year, platform = 'PC', imgUrl = '') {
	const key = `${name} (${year}) - ${platform}`;
	if (cart[key]) {
		toggleCartDrawer();
	} else {
		cart[key] = {
			name: name,
			year: year,
			platform: platform,
			priceFC: gamePriceFC,
			priceUSD: gamePriceUSD,
			img: imgUrl || `images/${slugify(name)}.jpg`
		};
		saveCart();
		toggleCartDrawer();
	}
}

function removeFromCart(key) {
	delete cart[key];
	saveCart();
	renderCart();
}

function saveCart() {
	localStorage.setItem('shogi_global_cart', JSON.stringify(cart));
	updateCartBadge();
}

function updateCartBadge() {
	const total = Object.keys(cart).length;
	document.getElementById('navCartCount').innerText = total;
}

function renderCart() {
	const body = document.getElementById('cartBody');
	const footer = document.getElementById('cartFooter');
	const keys = Object.keys(cart);
	
	if (keys.length === 0) {
		body.innerHTML = `
			<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; margin-top:50px; padding: 0 20px;">
				<svg viewBox="0 0 24 24" style="width: 56px; height: 56px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 16px;">
					<circle cx="9" cy="21" r="1"></circle>
					<circle cx="20" cy="21" r="1"></circle>
					<path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
				</svg>
				<div style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 8px;">Votre panier est vide</div>
				<div style="font-size: 12px; color: var(--text-muted); line-height: 1.5;">Vous n'avez pas encore ajouté de jeux dans votre panier. Parcourez le site pour trouver des offres incroyables !</div>
			</div>
		`;
		footer.innerHTML = '';
		return;
	}
	
	let html = '';
	let totalFC = 0;
	let totalUSD = 0;
	let waText = `Enchanté Mr Sev, c'est ${clientName || 'un client'}. Je souhaite commander les jeux suivants :\n\n`;
	
	keys.forEach(key => {
		const item = cart[key];
		totalFC += item.priceFC;
		totalUSD += parseFloat(item.priceUSD);
		waText += `▪ ${item.name} (${item.year}) [Plateforme : ${item.platform}] - ${item.priceFC.toLocaleString('fr-FR')} FC (${item.priceUSD} $)\n`;
		
		html += `
		<div class="cart-item">
			<img src="${item.img}" alt="${escapeHtml(item.name)}" class="cart-item-img" onerror="this.style.display='none'">
			<div class="cart-item-details">
				<div style="font-size:12px; font-weight:800; text-transform:uppercase; color:#fff;">${escapeHtml(item.name)}</div>
				<div style="font-size:10px; color:var(--text-muted);">📅 Année : ${item.year} | 💻 Plateforme : <b>${item.platform}</b></div>
				<div style="font-size:11px; font-weight:900; color:var(--gold); margin-top:2px;">${item.priceFC.toLocaleString('fr-FR')} FC / ${item.priceUSD} $</div>
			</div>
			<button class="cart-item-delete" onclick="removeFromCart('${escapeQuotes(key)}')">&times;</button>
		</div>`;
	});
	
	body.innerHTML = html;
	const finalUSDFormatted = totalUSD.toFixed(2);
	const waLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(waText + `\n💰 Total Général : ${totalFC.toLocaleString('fr-FR')} FC (${finalUSDFormatted} $)`)}`;
	
	footer.innerHTML = `
		<div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:13px; font-weight:700;">
			<span>Total Général</span>
			<span style="color:var(--gold); font-size:14px;">${totalFC.toLocaleString('fr-FR')} FC / ${finalUSDFormatted} $</span>
		</div>
		<a href="${waLink}" target="_blank" class="btn-checkout">Valider la commande WhatsApp</a>
	`;
}

function escapeHtml(text) {
	return text.replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' })[m]);
}
function escapeQuotes(text) {
	return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}
