.ig-brand-text {

}
.platform-pill:hover, .platform-pill.active {

.container {

.search-icon {

.clear-search-btn {

(function initAdaptiveResolution() {
	const dpr = window.devicePixelRatio || 1;
	const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
	document.documentElement.style.setProperty('--vh-scale', `${window.innerHeight * 0.01}px`);
	if (isMobile && dpr > 1) { document.body.classList.add('high-density-mobile'); }
	window.addEventListener('resize', () => {
		document.documentElement.style.setProperty('--vh-scale', `${window.innerHeight * 0.01}px`);
	});
})();

let imageObserver = null;
function initImageObserver() {
	if ('IntersectionObserver' in window) {
		imageObserver = new IntersectionObserver((entries, observer) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					const img = entry.target;
					const realSrc = img.getAttribute('data-src');
					if (realSrc) {
						img.src = realSrc;
						img.onload = () => img.classList.add('loaded');
						img.removeAttribute('data-src');
					}
					observer.unobserve(img);
				}
			});
		}, { root: null, rootMargin: '100px 0px', threshold: 0.01 });
	}
}

document.addEventListener("DOMContentLoaded", () => {
	initImageObserver();
	if (clientName) {
		updateUserProfileDisplay(clientName);
	}
	renderGames();
	updateCartBadge();
});

function updateUserProfileDisplay(name) {
	const badge = document.getElementById('userProfileBadge');
	const nameSpan = document.getElementById('navClientName');
	if (badge && nameSpan) {
		nameSpan.innerText = name;
		badge.style.display = 'flex';
	}
}

function slugify(text) {
	return text.toString().toLowerCase()
		.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
		.replace(/['']/g, '-')
		.replace(/[^a-z0-9 -]/g, '')
		.replace(/\s+/g, '-')
		.replace(/-+/g, '-');
}

function renderGames() {
	const grid = document.getElementById('gameGrid');
	grid.innerHTML = '';
	
	const filteredGames = androidGamesData.filter(game => {
		const [year, name] = game;
		const fullName = `${name} ${year}`.toLowerCase();
		return fullName.includes(currentSearchQuery);
	});

	const totalItems = filteredGames.length;
	const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
	
	if (currentPage > totalPages) currentPage = totalPages;
	
	const startIndex = (currentPage - 1) * itemsPerPage;
	const endIndex = startIndex + itemsPerPage;
	const paginatedGames = filteredGames.slice(startIndex, endIndex);

	paginatedGames.forEach(game => {
		const [year, name, info] = game;
		const imageFileName = `images/${slugify(name)}.jpg`;
		const fullGameName = `${name} (${year})`;
		const orderText = `Enchanté Mr Sev, c'est ${clientName || 'un client'}. Je souhaite commander ${fullGameName} sur Android.`;
		const waLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(orderText)}`;

		card.onclick = () => openGameModal(name, year, info, imageFileName, waLink);

		card.innerHTML = `

				</div>
				<div class="card-top">
					<span class="game-year">${year}</span>
					<span class="game-price">${gamePriceFC.toLocaleString('fr-FR')} FC / ${gamePriceUSD} $</span>

function renderPagination(totalPages) {
	const container = document.getElementById('paginationContainer');
	container.innerHTML = '';

	if (totalPages <= 1) return;

	const btn1 = document.createElement('button');
	btn1.className = `page-btn ${currentPage === 1 ? 'active' : ''}`;
	btn1.innerText = '1';
	btn1.onclick = () => goToPage(1);
	container.appendChild(btn1);

	if (totalPages >= 2) {
		const btn2 = document.createElement('button');
		btn2.className = `page-btn ${currentPage === 2 ? 'active' : ''}`;
		btn2.innerText = '2';
		btn2.onclick = () => goToPage(2);
		container.appendChild(btn2);
	}

	if (totalPages > 3) {
		const dots = document.createElement('span');
		dots.style.cssText = "color:var(--text-muted); padding:0 4px; font-weight:800;";
		dots.innerText = '...';
		container.appendChild(dots);
	}

	if (totalPages >= 3 && currentPage >= 3) {
		const btn3 = document.createElement('button');
		btn3.className = `page-btn active`;
		btn3.innerText = currentPage;
		container.appendChild(btn3);
	}

	const nextBtn = document.createElement('button');
	nextBtn.className = `page-btn ${currentPage >= totalPages ? 'disabled' : ''}`;
	nextBtn.innerHTML = 'Suivant &raquo;';
	nextBtn.onclick = () => {
		if (currentPage < totalPages) goToPage(currentPage + 1);
	};
	container.appendChild(nextBtn);
}

function goToPage(page) {
	currentPage = page;
	renderGames();
	window.scrollTo({ top: 100, behavior: 'smooth' });
}

function handleSearchInput() {
	currentSearchQuery = document.getElementById('gameSearch').value.trim().toLowerCase();
	document.getElementById('clearSearchBtn').style.display = currentSearchQuery ? 'flex' : 'none';
	currentPage = 1;
	renderGames();
}

function clearSearch() {
	document.getElementById('gameSearch').value = '';
	currentSearchQuery = '';
	document.getElementById('clearSearchBtn').style.display = 'none';
	currentPage = 1;
	renderGames();
}

function updateCounter(total) {
	document.getElementById('gameCounter').innerText = `${total} jeux`;
	document.getElementById('noResults').style.display = total === 0 ? 'block' : 'none';
}

function openGameModal(name, year, info, imgUrl, waLink) {
	document.getElementById('modalImg').src = imgUrl;
	document.getElementById('modalTitle').innerText = name;
	document.getElementById('modalYear').innerText = `Année : ${year}`;
	document.getElementById('modalPrice').innerText = `${gamePriceFC.toLocaleString('fr-FR')} FC / ${gamePriceUSD} $`;
	document.getElementById('modalDesc').innerText = info;
	document.getElementById('modalActions').innerHTML = `
		<button class="btn-cart-mini" style="flex:1; padding: 12px;" onclick="addToCart('${escapeQuotes(name)}', '${year}', 'Android', '${imgUrl}'); closeGameModal();">Ajouter au Panier</button>
		<a href="${waLink}" target="_blank" class="btn-whatsapp-mini" style="padding: 12px;">Commander WhatsApp</a>
	`;
	document.getElementById('gameModal').style.display = 'flex';
}

function closeGameModal() {
	document.getElementById('gameModal').style.display = 'none';
}

function toggleCartDrawer() {
	const overlay = document.getElementById('cartOverlay');
	if (overlay.style.display === 'flex') {
		overlay.classList.remove('open');
		setTimeout(() => overlay.style.display = 'none', 300);
	} else {
		overlay.style.display = 'flex';
		setTimeout(() => overlay.classList.add('open'), 10);
		renderCart();
	}
}

function addToCart(name, year, platform = 'Android', imgUrl = '') {
	const key = `${name} (${year}) - ${platform}`;
	if (cart[key]) {
		toggleCartDrawer();
	} else {
		cart[key] = {
			name: name,
			year: year,
			platform: platform,
			priceFC: gamePriceFC,
			priceUSD: gamePriceUSD,
			img: imgUrl || `images/${slugify(name)}.jpg`
		};
		saveCart();
		toggleCartDrawer();
	}
}

function removeFromCart(key) {
	delete cart[key];
	saveCart();
	renderCart();
}

function saveCart() {
	localStorage.setItem('shogi_global_cart', JSON.stringify(cart));
	updateCartBadge();
}

function updateCartBadge() {
	const total = Object.keys(cart).length;
	document.getElementById('navCartCount').innerText = total;
}

		const item = cart[key];
		totalFC += item.priceFC;
		totalUSD += parseFloat(item.priceUSD);
		waText += `▪ ${item.name} (${item.year}) [Plateforme : ${item.platform}] - ${item.priceFC.toLocaleString('fr-FR')} FC (${item.priceUSD} $)\n`;
		
		html += `
		<div class="cart-item">
			<img src="${item.img}" alt="${escapeHtml(item.name)}" class="cart-item-img" onerror="this.style.display='none'">
			<div class="cart-item-details">
				<div style="font-size:12px; font-weight:800; text-transform:uppercase; color:#fff;">${escapeHtml(item.name)}</div>
				<div style="font-size:10px; color:var(--text-muted);">📅 Année : ${item.year} | 📱 Plateforme : <b>${item.platform}</b></div>
				<div style="font-size:11px; font-weight:900; color:var(--gold); margin-top:2px;">${item.priceFC.toLocaleString('fr-FR')} FC / ${item.priceUSD} $</div>
			</div>
			<button class="cart-item-delete" onclick="removeFromCart('${escapeQuotes(key)}')">&times;</button>
		</div>`;
	});
	
	body.innerHTML = html;
	const finalUSDFormatted = totalUSD.toFixed(2);
	const waLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(waText + `\n💰 Total Général : ${totalFC.toLocaleString('fr-FR')} FC (${finalUSDFormatted} $)`)}`;
	
	footer.innerHTML = `
		<div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:13px; font-weight:700;">
			<span>Total Général</span>
			<span style="color:var(--gold); font-size:14px;">${totalFC.toLocaleString('fr-FR')} FC / ${finalUSDFormatted} $</span>
		</div>
		<a href="${waLink}" target="_blank" class="btn-checkout">Valider la commande WhatsApp</a>
	`;
}

function escapeHtml(text) {
	return text.replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' })[m]);
}
function escapeQuotes(text) {
	return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}
</script>
