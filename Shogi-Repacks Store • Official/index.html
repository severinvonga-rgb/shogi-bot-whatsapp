<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Shogi-repacks.com - Official Store</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<style>
:root {
	--bg-main: #0b0c10;
	--card-bg: #14161f;
	--card-hover: #1c1f2b;
	--accent: #ff5500;
	--accent-hover: #ff7324;
	--accent-glow: rgba(255, 85, 0, 0.35);
	--gold: #f5a623;
	--gold-glow: rgba(245, 166, 35, 0.25);
	--whatsapp: #25D366;
	--whatsapp-hover: #20ba5a;
	--border-glass: rgba(255, 255, 255, 0.08);
	--border-glow: rgba(255, 85, 0, 0.4);
	--text-main: #ffffff;
	--text-muted: #94969e;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
	margin: 0;
	background: var(--bg-main);
	color: var(--text-main);
	font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
	min-height: 100vh;
	-webkit-font-smoothing: antialiased;
	overflow-x: hidden;
	-webkit-user-select: none;
	user-select: none;
}

/* NAVBAR TOP */
.ig-navbar {
	background: #111319;
	border-bottom: 1px solid var(--border-glass);
	padding: 10px 16px;
	display: flex;
	justify-content: space-between;
	align-items: center;
	position: sticky;
	top: 0;
	z-index: 1000;
}

.ig-brand {
	display: flex;
	align-items: center;
	gap: 10px;
	text-decoration: none;
}

.ig-brand-logo {
	width: 44px; 
	height: 44px;
	display: flex;
	align-items: center;
	justify-content: center;
	filter: drop-shadow(0 0 8px rgba(255, 85, 0, 0.4));
}

.ig-brand-logo img { 
	width: 100%; 
	height: 100%; 
	object-fit: contain;
	image-rendering: -webkit-optimize-contrast;
}

.ig-brand-text {
	display: flex;
	flex-direction: column;
	justify-content: center;
}

.brand-title-main {
	font-family: 'Inter', system-ui, -apple-system, sans-serif;
	font-size: 15px;
	font-weight: 700;
	letter-spacing: 1.8px;
	color: #ffffff;
	line-height: 1.1;
	text-transform: uppercase;
}

.brand-title-sub {
	font-family: 'Inter', system-ui, -apple-system, sans-serif;
	font-size: 14px;
	font-weight: 700;
	letter-spacing: 2px;
	color: var(--accent);
	line-height: 1.1;
	text-transform: uppercase;
}

.ig-nav-actions {
	display: flex;
	align-items: center;
	gap: 10px;
}

/* BLOC USER PROFILE NAV */
.user-profile-badge {
	display: flex;
	align-items: center;
	gap: 6px;
	background: rgba(255, 255, 255, 0.05);
	border: 1px solid var(--border-glass);
	padding: 6px 12px;
	border-radius: 10px;
	font-size: 12px;
	font-weight: 800;
	color: #fff;
}

.user-profile-badge img {
	width: 18px;
	height: 18px;
	object-fit: contain;
}

/* BOUTON PANIER */
.ig-icon-btn {
	background: rgba(255, 255, 255, 0.08);
	border: 1px solid var(--border-glass);
	color: #fff;
	padding: 8px 12px;
	border-radius: 10px;
	font-size: 13px;
	font-weight: 700;
	display: flex;
	align-items: center;
	gap: 6px;
	cursor: pointer;
	transition: all 0.2s;
}
.ig-icon-btn:hover { background: rgba(255, 255, 255, 0.15); }

.ig-cart-icon-img {
	width: 20px;
	height: 20px;
	object-fit: contain;
}

.ig-cart-badge {
	background: var(--gold);
	color: #000;
	font-size: 11px;
	padding: 1px 6px;
	border-radius: 6px;
	font-weight: 900;
}

/* BARRE DES PLATEFORMES (STICKY) */
.platforms-bar {
	display: flex;
	gap: 8px;
	padding: 12px 16px;
	background: rgba(17, 19, 25, 0.95);
	backdrop-filter: blur(10px);
	overflow-x: auto;
	border-bottom: 1px solid var(--border-glass);
	scrollbar-width: none;
	position: sticky;
	top: 65px;
	z-index: 990;
}
.platforms-bar::-webkit-scrollbar { display: none; }

.platform-pill {
	background: rgba(255, 255, 255, 0.05);
	border: 1px solid var(--border-glass);
	color: var(--text-muted);
	padding: 6px 14px;
	border-radius: 20px;
	font-size: 12px;
	font-weight: 700;
	white-space: nowrap;
	cursor: pointer;
	transition: all 0.2s;
	display: flex;
	align-items: center;
	gap: 6px;
}
.platform-pill:hover, .platform-pill.active {
	background: rgba(255, 85, 0, 0.15);
	color: #fff;
	border-color: var(--accent);
}

.container { 
	max-width: 1200px; 
	margin: 0 auto; 
	padding: 16px; 
}

/* ÉCRAN D'AUTHENTIFICATION PRO */
.auth-overlay {
	display: flex;
	justify-content: center;
	align-items: center;
	min-height: 100vh;
	background: rgba(11, 12, 16, 0.95);
	backdrop-filter: blur(20px);
	position: fixed;
	top: 0; left: 0; width: 100%; height: 100%;
	z-index: 9999;
	padding: 20px;
}

.auth-card {
	background: var(--card-bg);
	border: 1px solid var(--border-glass);
	padding: 30px 20px;
	border-radius: 20px;
	box-shadow: 0 25px 50px rgba(0,0,0,0.8);
	text-align: center;
	max-width: 380px;
	width: 100%;
}

.auth-card .ig-brand-logo {
	width: 90px;
	height: 90px;
	margin: 0 auto 16px auto;
}

.auth-card input {
	width: 100%;
	padding: 14px;
	margin-bottom: 15px;
	border: 1px solid var(--border-glass);
	background: rgba(0, 0, 0, 0.4);
	color: #fff;
	border-radius: 12px;
	font-size: 14px;
	outline: none;
}
.auth-card input:focus { border-color: var(--accent); }

.auth-card button {
	background: var(--accent);
	color: white;
	border: none;
	padding: 14px;
	font-weight: 700;
	border-radius: 12px;
	cursor: pointer;
	width: 100%;
	font-size: 13px;
	text-transform: uppercase;
}

.auth-error-msg {
	background: rgba(255, 69, 58, 0.15);
	color: #ff453a;
	padding: 10px;
	border-radius: 8px;
	font-size: 11px;
	margin-bottom: 15px;
	display: none;
	text-align: left;
}

/* CARROUSEL SPOTLIGHT RESPONSIVE */
.upcoming-carousel {
	background: #14161f;
	border: 1px solid var(--border-glass);
	border-radius: 16px;
	overflow: hidden;
	margin-bottom: 24px;
	box-shadow: 0 12px 35px rgba(0,0,0,0.6);
	position: relative;
	height: 220px;
}
@media (min-width: 768px) {
	.upcoming-carousel { height: 320px; }
}

.carousel-slide {
	position: absolute;
	top: 0; left: 0; width: 100%; height: 100%;
	opacity: 0;
	transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
	display: flex;
	align-items: flex-end;
	will-change: opacity;
}
.carousel-slide.active { opacity: 1; }

.carousel-slide picture {
	position: absolute;
	top: 0; left: 0; width: 100%; height: 100%;
	z-index: 1;
}

.carousel-slide img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center;
	image-rendering: -webkit-optimize-contrast;
}

.carousel-gradient-overlay {
	position: absolute;
	top: 0; left: 0; width: 100%; height: 100%;
	background: linear-gradient(to top, rgba(0,0,0,0.9) 10%, rgba(0,0,0,0.3) 60%, transparent 100%);
	z-index: 2;
}

.carousel-content {
	position: relative;
	z-index: 3;
	padding: 20px;
	display: flex;
	justify-content: space-between;
	align-items: flex-end;
	width: 100%;
}

.carousel-game-title {
	font-size: clamp(16px, 2.5vw, 24px);
	font-weight: 900;
	text-transform: uppercase;
	color: #fff;
	margin: 0 0 6px 0;
	text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

.carousel-badges-row {
	display: flex;
	align-items: center;
	gap: 10px;
}

.ig-discount-tag {
	background: var(--accent);
	color: #fff;
	font-weight: 900;
	font-size: 12px;
	padding: 4px 8px;
	border-radius: 6px;
	box-shadow: 0 0 10px var(--accent-glow);
}

.ig-price-tag {
	background: rgba(0, 0, 0, 0.6);
	backdrop-filter: blur(6px);
	border: 1px solid var(--border-glass);
	color: #fff;
	font-weight: 900;
	font-size: 15px;
	padding: 4px 12px;
	border-radius: 6px;
}

/* BARRE DE RECHERCHE PRO */
.search-section {
	margin-bottom: 24px;
}
.search-box-container { 
	position: relative; 
	width: 100%; 
	display: flex;
	align-items: center;
}

#gameSearch {
	width: 100%;
	padding: 14px 40px 14px 45px;
	background: var(--card-bg);
	border: 1px solid var(--border-glass);
	border-radius: 14px;
	color: #ffffff; 
	font-size: 14px;
	outline: none; 
	transition: all 0.2s ease;
}
#gameSearch:focus {
	border-color: var(--accent);
	background: var(--card-hover);
}

.search-icon {
	position: absolute;
	left: 15px;
	width: 18px; height: 18px;
	fill: var(--text-muted);
}

.clear-search-btn {
	position: absolute;
	right: 14px;
	background: rgba(255, 255, 255, 0.08);
	border: none;
	color: var(--text-muted);
	width: 24px; height: 24px;
	border-radius: 50%;
	display: none;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	font-size: 14px;
}

.section-title {
	font-size: 15px;
	text-transform: uppercase;
	font-weight: 900;
	letter-spacing: 1px;
	margin-bottom: 14px;
	display: flex;
	align-items: center;
	justify-content: space-between;
}
.section-title span { color: var(--accent); font-size: 12px; }

/* GRILLE DE JEUX UNIVERSELLE */
.game-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 12px;
}
@media (min-width: 576px) {
	.game-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
}
@media (min-width: 992px) {
	.game-grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; }
}

.game-card {
	background: var(--card-bg);
	border: 1px solid var(--border-glass);
	border-radius: 14px;
	padding: 10px;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
	transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.25s;
	cursor: pointer;
	will-change: transform;
}
.game-card:hover {
	transform: translateY(-3px);
	border-color: var(--border-glow);
}

.game-thumbnail-container {
	width: 100%;
	height: 110px;
	border-radius: 10px;
	overflow: hidden;
	margin-bottom: 8px;
	background: #0d0f17;
	position: relative;
}
@media (min-width: 768px) {
	.game-thumbnail-container { height: 130px; }
}

.game-thumbnail {
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center;
	image-rendering: -webkit-optimize-contrast;
	opacity: 0;
	transition: opacity 0.4s ease-in-out;
}
.game-thumbnail.loaded { opacity: 1; }

.card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.game-year { 
	color: var(--accent); 
	font-weight: 800; 
	font-size: 9px; 
	background: rgba(255, 85, 0, 0.1);
	padding: 3px 6px;
	border-radius: 4px;
}
.game-price {
	color: #000;
	font-weight: 900;
	font-size: 10px;
	background: var(--gold);
	padding: 3px 8px;
	border-radius: 4px;
}

.game-name { 
	font-size: 12px; 
	font-weight: 800; 
	text-transform: uppercase; 
	line-height: 1.2;
	margin-bottom: 4px;
	color: #fff;
	display: -webkit-box;
	-webkit-line-clamp: 2;
	-webkit-box-orient: vertical;
	overflow: hidden;
}
@media(min-width: 768px) { .game-name { font-size: 13px; } }

.game-info {
	font-size: 10px;
	color: var(--text-muted);
	margin-bottom: 10px;
	display: -webkit-box;
	-webkit-line-clamp: 2;
	-webkit-box-orient: vertical;
	overflow: hidden;
}

.card-actions {
	display: flex;
	gap: 6px;
}

.btn-whatsapp-mini {
	background: var(--whatsapp);
	color: white;
	border: none;
	padding: 8px;
	border-radius: 8px;
	font-size: 10px;
	font-weight: 800;
	text-decoration: none;
	display: flex;
	align-items: center;
	justify-content: center;
	flex: 1;
}
.btn-whatsapp-mini svg { width: 12px; height: 12px; fill: #fff; }

.btn-cart-mini {
	background: rgba(255, 255, 255, 0.08);
	border: 1px solid var(--border-glass);
	color: white;
	padding: 8px;
	border-radius: 8px;
	font-size: 10px;
	font-weight: 800;
	cursor: pointer;
}
.btn-cart-mini:hover { background: var(--accent); border-color: var(--accent); }

/* PAGINATION PRO STYLE */
.pagination-container {
	display: flex;
	justify-content: center;
	align-items: center;
	gap: 8px;
	margin: 30px 0 20px 0;
}

.page-btn {
	background: var(--card-bg);
	border: 1px solid var(--border-glass);
	color: var(--text-muted);
	min-width: 38px;
	height: 38px;
	padding: 0 10px;
	border-radius: 10px;
	font-weight: 800;
	font-size: 13px;
	display: flex;
	align-items: center;
	justify-content: center;
	cursor: pointer;
	transition: all 0.2s;
}

.page-btn:hover {
	border-color: var(--accent);
	color: #fff;
}

.page-btn.active {
	background: var(--accent);
	color: #fff;
	border-color: var(--accent);
	box-shadow: 0 0 12px var(--accent-glow);
}

.page-btn.disabled {
	opacity: 0.4;
	cursor: not-allowed;
	pointer-events: none;
}

/* MODALE DÉTAILS JEU */
.modal-overlay {
	position: fixed;
	top: 0; left: 0; width: 100%; height: 100%;
	background: rgba(0, 0, 0, 0.85);
	backdrop-filter: blur(10px);
	z-index: 2000;
	display: none;
	justify-content: center;
	align-items: center;
	padding: 16px;
}
.modal-card {
	background: var(--card-bg);
	border: 1px solid var(--border-glass);
	border-radius: 16px;
	max-width: 500px;
	width: 100%;
	max-height: 90vh;
	overflow-y: auto;
	padding: 20px;
	position: relative;
}
.modal-close-btn {
	position: absolute; top: 12px; right: 12px;
	background: rgba(255,255,255,0.1); border: none; color: #fff;
	width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
}
.modal-hero-img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; image-rendering: -webkit-optimize-contrast; }

/* PANIER COULISSANT TRANSPARENT (GLASSMORPHISME AUX COULEURS DU SITE) */
.cart-drawer-overlay {
	position: fixed; top: 0; left: 0; width: 100%; height: 100%;
	background: rgba(11, 12, 16, 0.6); backdrop-filter: blur(6px);
	z-index: 3000; display: none; justify-content: flex-end;
}
.cart-drawer {
	width: 100%; max-width: 400px; height: 100%;
	background: rgba(17, 19, 25, 0.85); backdrop-filter: blur(16px);
	border-left: 1px solid var(--border-glass);
	display: flex; flex-direction: column;
	transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
	box-shadow: -10px 0 30px rgba(0,0,0,0.5);
}
.cart-drawer-overlay.open .cart-drawer { transform: translateX(0); }

.cart-header { padding: 18px; border-bottom: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center; background: rgba(20, 22, 31, 0.5); }
.cart-body { padding: 16px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.cart-item { background: rgba(20, 22, 31, 0.6); border: 1px solid var(--border-glass); border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 12px; position: relative; backdrop-filter: blur(4px); }
.cart-item-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background: #0d0f17; flex-shrink: 0; }
.cart-item-details { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
.cart-item-delete { background: rgba(255, 69, 58, 0.2); border: none; color: #ff453a; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }

.cart-footer { padding: 18px; border-top: 1px solid var(--border-glass); background: rgba(20, 22, 31, 0.8); backdrop-filter: blur(8px); }

.btn-checkout {
	background: var(--whatsapp); color: #fff; border: none; width: 100%;
	padding: 14px; border-radius: 12px; font-weight: 900; font-size: 12px;
	text-transform: uppercase; cursor: pointer; text-decoration: none; display: block; text-align: center;
	transition: background 0.2s;
}
.btn-checkout:hover { background: var(--whatsapp-hover); }

.no-results { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); display: none; font-size: 13px; }
</style>
</head>
<body>

<!-- ÉCRAN D'AUTHENTIFICATION PRO -->
<div class="auth-overlay" id="authOverlay" style="display: none;">
	<div class="auth-card">
		<div class="ig-brand-logo">
			<img src="logo.svg" alt="Shogi Repacks Logo">
		</div>
		<div class="ig-brand-text" style="margin-bottom: 15px;">
			<span class="brand-title-main">SHOGI</span>
			<span class="brand-title-sub">REPACKS</span>
		</div>
		<p style="color: var(--text-muted); font-size: 12px; margin-bottom: 20px;">Entrez votre nom complet pour accéder au catalogue.</p>
		<div class="auth-error-msg" id="authErrorMsg"></div>
		<form onsubmit="saveClientName(event)">
			<input type="text" id="clientInput" placeholder="Votre nom complet..." required autocomplete="off">
			<button type="submit">Entrer dans la boutique</button>
		</form>
	</div>
</div>

<!-- NAVBAR TOP -->
<div class="ig-navbar">
	<a href="#" class="ig-brand">
		<div class="ig-brand-logo">
			<img src="logo.svg" alt="Shogi Repacks Logo">
		</div>
		<div class="ig-brand-text">
			<span class="brand-title-main">SHOGI</span>
			<span class="brand-title-sub">REPACKS</span>
		</div>
	</a>
	<div class="ig-nav-actions">
		<!-- PROFIL CLIENT -->
		<div class="user-profile-badge" id="userProfileBadge" style="display: none;">
			<img src="icon-avatar.svg" alt="Avatar">
			<span id="navClientName">Client</span>
		</div>
		
		<!-- BOUTON PANIER TRANSPARENT AVEC ICON-AVATAR2.SVG -->
		<button class="ig-icon-btn" onclick="toggleCartDrawer()">
			<img src="icon-avatar2.svg" alt="Panier" class="ig-cart-icon-img">
			<span class="ig-cart-badge" id="navCartCount">0</span>
		</button>
	</div>
</div>

<!-- BARRE DE PLATEFORMES (STICKY) -->
<div class="platforms-bar">
	<div class="platform-pill active" onclick="filterPlatform('all')">🔥 Tous les jeux</div>
	<div class="platform-pill" onclick="window.location.href='Games PC/games-pc.html'">Games PC</div>
	<div class="platform-pill" onclick="window.location.href='Games Android/games-android.html'">Games Android</div>
	<div class="platform-pill" onclick="window.location.href='Système Windows/syst-win.html'">Système Windows</div>
</div>

<div class="container">

	<!-- CARROUSEL SPOTLIGHT RESPONSIVE -->
	<div class="upcoming-carousel" id="upcomingCarousel"></div>

	<!-- BARRE DE RECHERCHE PRO -->
	<div class="search-section">
		<div class="search-box-container">
			<input type="text" id="gameSearch" placeholder="Rechercher" oninput="handleSearchInput()">
			<svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
			<button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()">&times;</button>
		</div>
	</div>

	<div class="section-title">
		Tendances & Sorties <span id="gameCounter">0 jeux</span>
	</div>

	<div class="game-grid" id="gameGrid"></div>
	<div class="no-results" id="noResults">Aucun jeu ne correspond à votre recherche.</div>

	<!-- CONTENEUR DE PAGINATION PRO -->
	<div class="pagination-container" id="paginationContainer"></div>

</div>

<!-- MODALE DÉTAILS DU JEU -->
<div class="modal-overlay" id="gameModal" onclick="closeGameModal()">
	<div class="modal-card" onclick="event.stopPropagation()">
		<button class="modal-close-btn" onclick="closeGameModal()">&times;</button>
		<img src="" alt="" class="modal-hero-img" id="modalImg">
		<h2 style="font-size: 16px; text-transform: uppercase; margin: 0 0 8px 0;" id="modalTitle"></h2>

let imageObserver = null;
function initImageObserver() {
	if ('IntersectionObserver' in window) {
		imageObserver = new IntersectionObserver((entries, observer) => {
			entries.forEach(entry => {
				if (entry.isIntersecting) {
					const img = entry.target;
					const realSrc = img.getAttribute('data-src');
					if (realSrc) {
						img.src = realSrc;
						img.onload = () => img.classList.add('loaded');
						img.removeAttribute('data-src');
					}
					observer.unobserve(img);
				}
			});
		}, { root: null, rootMargin: '100px 0px', threshold: 0.01 });
	}
}

				</div>
			</div>
		`;
		carousel.appendChild(slide);
	});

		}, 10000);
	}
}

	updateUserProfileDisplay(clientName);

}

function slugify(text) {
	return text.toString().toLowerCase()
		.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
		.replace(/['']/g, '-')
		.replace(/[^a-z0-9 -]/g, '')
		.replace(/\s+/g, '-')
		.replace(/-+/g, '-');
}

		const btn3 = document.createElement('button');
		btn3.className = `page-btn active`;
		btn3.innerText = currentPage;
		container.appendChild(btn3);
	}

	const nextBtn = document.createElement('button');
	nextBtn.className = `page-btn ${currentPage >= totalPages ? 'disabled' : ''}`;
	nextBtn.innerHTML = 'Suivant &raquo;';
	nextBtn.onclick = () => {
		if (currentPage < totalPages) goToPage(currentPage + 1);
	};
	container.appendChild(nextBtn);
}

function goToPage(page) {
	currentPage = page;
	renderGames();
	window.scrollTo({ top: 400, behavior: 'smooth' });
}

function handleSearchInput() {
	currentSearchQuery = document.getElementById('gameSearch').value.trim().toLowerCase();
	document.getElementById('clearSearchBtn').style.display = currentSearchQuery ? 'flex' : 'none';
	currentPage = 1;
	renderGames();
}

function clearSearch() {
	document.getElementById('gameSearch').value = '';
	currentSearchQuery = '';
	document.getElementById('clearSearchBtn').style.display = 'none';
	currentPage = 1;
	renderGames();
}

function updateCounter(total) {
	document.getElementById('gameCounter').innerText = `${total} jeux`;
	document.getElementById('noResults').style.display = total === 0 ? 'block' : 'none';
}

function openGameModal(name, year, info, imgUrl, waLink) {
	document.getElementById('modalImg').src = imgUrl;
	document.getElementById('modalTitle').innerText = name;
	document.getElementById('modalYear').innerText = `Année : ${year}`;
	document.getElementById('modalPrice').innerText = `${gamePriceFC.toLocaleString('fr-FR')} FC / ${gamePriceUSD} $`;
	document.getElementById('modalDesc').innerText = info;
	document.getElementById('modalActions').innerHTML = `
		<button class="btn-cart-mini" style="flex:1; padding: 12px;" onclick="addToCart('${escapeQuotes(name)}', '${year}', 'PC', '${imgUrl}'); closeGameModal();">Ajouter au Panier</button>
		<a href="${waLink}" target="_blank" class="btn-whatsapp-mini" style="padding: 12px;">Commander WhatsApp</a>
	`;
	document.getElementById('gameModal').style.display = 'flex';
}

function closeGameModal() {
	document.getElementById('gameModal').style.display = 'none';
}

function toggleCartDrawer() {
	const overlay = document.getElementById('cartOverlay');
	if (overlay.style.display === 'flex') {
		overlay.classList.remove('open');
		setTimeout(() => overlay.style.display = 'none', 300);
	} else {
		overlay.style.display = 'flex';
		setTimeout(() => overlay.classList.add('open'), 10);
		renderCart();
	}
}

// LOGIQUE INTELLIGENTE : SI LE JEU EST DÉJÀ LÀ, OUVERTURE AUTOMATIQUE DU PANIER
function addToCart(name, year, platform = 'PC', imgUrl = '') {
	const key = `${name} (${year}) - ${platform}`;
	let resolvedImg = imgUrl || `Games PC/images/${slugify(name)}.jpg`;

	if (cart[key]) {
		toggleCartDrawer();
	} else {
		cart[key] = {
			name: name,
			year: year,
			platform: platform,
			priceFC: gamePriceFC,
			priceUSD: gamePriceUSD,
			img: resolvedImg
		};
		saveCart();
		toggleCartDrawer();
	}
}

function removeFromCart(key) {
	delete cart[key];
	saveCart();
	renderCart();
}

function saveCart() {
	localStorage.setItem('shogi_global_cart', JSON.stringify(cart));
	updateCartBadge();
}

function updateCartBadge() {
	const total = Object.keys(cart).length;
	document.getElementById('navCartCount').innerText = total;
}

function renderCart() {
	const body = document.getElementById('cartBody');
	const footer = document.getElementById('cartFooter');
	const keys = Object.keys(cart);
	
	if (keys.length === 0) {
		body.innerHTML = `
			<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; margin-top:50px; padding: 0 20px;">
				<svg viewBox="0 0 24 24" style="width: 56px; height: 56px; fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 16px;">
					<circle cx="9" cy="21" r="1"></circle>
					<circle cx="20" cy="21" r="1"></circle>
					<path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
				</svg>
				<div style="font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 8px;">Votre panier est vide</div>
				<div style="font-size: 12px; color: var(--text-muted); line-height: 1.5;">Vous n'avez pas encore ajouté de jeux dans votre panier. Parcourez le site pour trouver des offres incroyables !</div>
			</div>
		`;
		footer.innerHTML = '';
		return;
	}
	
	let html = '';
	let totalFC = 0;
	let totalUSD = 0;
	let waText = `Enchanté Mr Sev, c'est ${clientName || 'un client'}. Je souhaite commander les jeux suivants :\n\n`;
	
	keys.forEach(key => {
		const item = cart[key];
		totalFC += item.priceFC;
		totalUSD += parseFloat(item.priceUSD);
		waText += `▪ ${item.name} (${item.year}) [Plateforme : ${item.platform}] - ${item.priceFC.toLocaleString('fr-FR')} FC (${item.priceUSD} $)\n`;
		
		html += `
		<div class="cart-item">
			<img src="${item.img}" alt="${escapeHtml(item.name)}" class="cart-item-img" onerror="this.src='logo.svg'; this.style.objectFit='contain'; this.style.padding='5px';">
			<div class="cart-item-details">
				<div style="font-size:12px; font-weight:800; text-transform:uppercase; color:#fff;">${escapeHtml(item.name)}</div>
				<div style="font-size:10px; color:var(--text-muted);">📅 Année : ${item.year} | 💻 Plateforme : <b>${item.platform}</b></div>
				<div style="font-size:11px; font-weight:900; color:var(--gold); margin-top:2px;">${item.priceFC.toLocaleString('fr-FR')} FC / ${item.priceUSD} $</div>
			</div>
			<button class="cart-item-delete" onclick="removeFromCart('${escapeQuotes(key)}')">&times;</button>
		</div>`;
	});
	
	body.innerHTML = html;
	const finalUSDFormatted = totalUSD.toFixed(2);
	const waLink = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(waText + `\n💰 Total Général : ${totalFC.toLocaleString('fr-FR')} FC (${finalUSDFormatted} $)`)}`;
	
	footer.innerHTML = `
		<div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:13px; font-weight:700;">
			<span>Total Général</span>
			<span style="color:var(--gold); font-size:14px;">${totalFC.toLocaleString('fr-FR')} FC / ${finalUSDFormatted} $</span>
		</div>
		<a href="${waLink}" target="_blank" class="btn-checkout">Valider la commande WhatsApp</a>
	`;
}

function escapeHtml(text) {
	return text.replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' })[m]);
}
function escapeQuotes(text) {
	return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}
</script>
</body>
</html>
